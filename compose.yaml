services:
  kairis:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./data/input:/home/kairis/app/data/input
      - ./output:/home/kairis/app/output
    environment:
      KAIRIS_LLM_ENABLED: "false"
      KAIRIS_OLLAMA_URL: "http://host.docker.internal:11434"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
