[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kairis-protocol"
version = "0.1.0"
description = "Kramers–Kronig-Assessed Impedance, Relaxation, and Integrated Spectroscopy"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "BSD-3-Clause" }
authors = [{ name = "KAIRIS contributors" }]
keywords = ["electrochemistry", "impedance", "EIS", "DRT", "spectroscopy"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: BSD License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "pandas>=2.0",
  "matplotlib>=3.7",
  "openai>=1.0",
  "watchdog>=3.0",
  "Flask>=3.0",
  "jsonschema>=4.0",
]

[project.urls]
Homepage = "https://github.com/Emanuel-963/KAIRIS"
Repository = "https://github.com/Emanuel-963/KAIRIS.git"
Issues = "https://github.com/Emanuel-963/KAIRIS/issues"

[project.scripts]
kairis = "run_pipeline:main"
kairis-web = "web_app:main"
kairis-setup = "setup_kairis:main"
kairis-update = "update_kairis:main"
kairis-esc = "standalone_esc:main"

[tool.setuptools]
packages = ["agents", "config", "core", "web"]
py-modules = ["run_pipeline", "setup_kairis", "standalone_esc", "update_kairis", "web_app"]
include-package-data = true

[tool.setuptools.package-data]
config = ["*.json"]
web = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
