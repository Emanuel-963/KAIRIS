name: Portability smoke

on:
  workflow_dispatch:
    inputs:
      full_corpus:
        description: Run all 198 retrospective spectra on each platform
        type: boolean
        default: false
  pull_request:
    branches: [main]
  push:
    branches: [main, ci/portability-smoke, 'release/**']

permissions:
  contents: read

jobs:
  smoke:
    name: Smoke on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      MPLBACKEND: Agg
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      KAIRIS_LLM_ENABLED: "false"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install KAIRIS
        run: python -m pip install -e .
      - name: Check installed CLI
        run: |
          kairis --help
          kairis-setup --check
      - name: Run and validate six spectra
        run: python scripts/run_portability_smoke.py --output output/portability-smoke
      - name: Upload platform evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portability-${{ matrix.os }}
          path: |
            output/portability-smoke/portability_evidence.json
            output/portability-smoke/pipeline.log
          if-no-files-found: warn

  full-corpus:
    if: |
      (github.event_name == 'workflow_dispatch' && inputs.full_corpus) ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/'))
    name: Full retrospective run on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      MPLBACKEND: Agg
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      KAIRIS_LLM_ENABLED: "false"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install KAIRIS
        run: python -m pip install -e .
      - name: Validate the retrospective corpus
        run: python scripts/run_release_validation.py --output output/portability-full
      - name: Upload platform evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portability-full-${{ matrix.os }}
          path: |
            output/portability-full/evidence/
            output/portability-full/pipeline.log
          if-no-files-found: warn
