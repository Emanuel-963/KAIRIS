name: Portability smoke

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main, ci/portability-smoke]

permissions:
  contents: read

jobs:
  smoke:
    name: Smoke on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      MPLBACKEND: Agg
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      KAIRIS_LLM_ENABLED: "false"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install KAIRIS
        run: python -m pip install -e .
      - name: Check installed CLI
        run: |
          kairis --help
          kairis-setup --check
      - name: Run and validate six spectra
        run: python scripts/run_portability_smoke.py --output output/portability-smoke
      - name: Upload platform evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portability-${{ matrix.os }}
          path: |
            output/portability-smoke/portability_evidence.json
            output/portability-smoke/pipeline.log
          if-no-files-found: warn
