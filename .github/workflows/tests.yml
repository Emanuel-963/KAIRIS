name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    name: Python 3.12 · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      MPLBACKEND: Agg
      KAIRIS_LLM_ENABLED: "false"

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt -e .

      - name: Check installed commands
        run: |
          kairis --help
          kairis-web --help
          kairis-setup --check

      - name: Validate POSIX launchers
        if: runner.os != 'Windows'
        run: sh -n scripts/setup_kairis.sh scripts/start_kairis.sh

      - name: Run test suite
        run: python -m pytest -q

      - name: Smoke-test frozen standalone gates
        shell: bash
        run: |
          git fetch --depth=1 origin standalone/gsf standalone/esc
          git worktree add ../kairis-gsf-standalone 26c50e1f3f922ccabfec3e8adaf2c7067af5af55
          git worktree add ../kairis-esc-standalone 311f0c072193c1a36b289d63b0f4228f84e3d4eb
          python scripts/evaluate_standalone_gates.py --limit 1 --output .standalone_gate_smoke --enforce

      - name: Check prerequisites
        run: python setup_kairis.py --check
